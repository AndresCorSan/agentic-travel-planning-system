[project]
name = "travel-intelligence-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "langgraph>=1.2.4",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "langchain-openrouter>=0.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.52",
    "aiosqlite>=0.22.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
testpaths = ["src/backend/tests"]
